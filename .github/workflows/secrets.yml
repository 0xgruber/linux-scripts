name: secrets-scan

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC = 8 AM CST / 9 AM CDT

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history - scan every old commit too
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
